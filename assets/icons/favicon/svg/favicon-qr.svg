<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- QR Code Optimized Favicon - Large Size Version -->
  <!-- Enhanced for clarity and recognition when embedded in QR codes -->
  <defs>
    <!-- Gradient matching digital business card theme -->
    <linearGradient id="bgGradientQR" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7FC9C3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF7A59;stop-opacity:1" />
    </linearGradient>
    <!-- Enhanced shadow for larger size -->
    <filter id="shadowQR" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="rgba(0,0,0,0.15)"/>
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="rgba(255,255,255,0.3)"/>
    </filter>
    <!-- Inner glow for depth -->
    <filter id="innerGlowQR" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="0" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle with enhanced stroke for larger size -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGradientQR)" 
          stroke="rgba(255,255,255,0.3)" stroke-width="4"/>
  
  <!-- Inner subtle circle for depth -->
  <circle cx="256" cy="256" r="230" fill="none" 
          stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  
  <!-- Initials "AS" - Enhanced typography for large display -->
  <text x="256" y="330" font-family="Poppins, sans-serif" font-size="180" 
        font-weight="600" text-anchor="middle" fill="white" 
        filter="url(#shadowQR)" letter-spacing="-8">AS</text>
  
  <!-- Subtle decorative accent (optional, enhances brand recognition) -->
  <circle cx="256" cy="256" r="200" fill="none" 
          stroke="rgba(255,255,255,0.1)" stroke-width="1.5" 
          stroke-dasharray="10,5"/>
</svg>

